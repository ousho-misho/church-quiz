<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار خدام الكنيسة</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; padding: 20px; direction: rtl; text-align: right; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative; }
    h2 { color: #2c3e50; text-align: center; margin-top: 10px; }
    
    /* تصميم شريط التايمر المثبت فوق */
    .timer-box { position: sticky; top: 10px; background: #e74c3c; color: white; padding: 10px 15px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
    
    .options-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
    .option-item { display: flex; align-items: center; gap: 10px; font-weight: normal; cursor: pointer; }
    .option-item input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }

    button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #219150; }

    #qr-container { display: none; text-align: center; margin-top: 25px; padding: 20px; background: #eef9f1; border: 2px dashed #27ae60; border-radius: 10px; }
    #qrcode img { display: block; margin: 15px auto; border: 5px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .reset-btn { background: #3498db; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <!-- شريط العد التنازلي -->
  <div class="timer-box" id="timerBox">الوقت المتبقي: <span id="timer">02:00</span></div>

  <h2>اختبار خدام الكنيسة</h2>

  <form id="quizForm">
    <!-- البيانات الأساسية -->
    <div class="form-group">
      <label>اسم الخادم:</label>
      <input type="text" id="name" required placeholder="أدخل الاسم الثلاثي">
    </div>

    <div class="form-group">
      <label>اسم الأسرة / المرحلة:</label>
      <input type="text" id="stage" required placeholder="مثال: ابتدائي / إعدادي">
    </div>

    <!-- أسئلة اختيار من متعدد -->
    <div class="form-group">
      <label>سؤال 1: كم عدد أسفار العهد الجديد؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q1" value="27 سِفر"> 27 سِفر</label>
        <label class="option-item"><input type="radio" name="q1" value="39 سِفر"> 39 سِفر</label>
        <label class="option-item"><input type="radio" name="q1" value="46 سِفر"> 46 سِفر</label>
      </div>
    </div>

    <div class="form-group">
      <label>سؤال 2: متى تُقام القداسات الإلهية؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q2" value="صباحاً"> صباحاً</label>
        <label class="option-item"><input type="radio" name="q2" value="مساءً"> مساءً</label>
        <label class="option-item"><input type="radio" name="q2" value="حسب الترتيب والطقس"> حسب الترتيب والطقس</label>
      </div>
    </div>

    <div class="form-group">
      <label>سؤال 3: من هو كاتب سفر الأعمال؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q3" value="القديس لوقا"> القديس لوقا</label>
        <label class="option-item"><input type="radio" name="q3" value="القديس يوحنا"> القديس يوحنا</label>
        <label class="option-item"><input type="radio" name="q3" value="القديس بطرس"> القديس بطرس</label>
      </div>
    </div>

    <div class="form-group">
      <label>سؤال 4: كم عدد الأسرار الكنسية؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q4" value="5 أسرار"> 5 أسرار</label>
        <label class="option-item"><input type="radio" name="q4" value="7 أسرار"> 7 أسرار</label>
        <label class="option-item"><input type="radio" name="q4" value="12 سر"> 12 سر</label>
      </div>
    </div>

    <div class="form-group">
      <label>سؤال 5: ما هي أول معجزة للسيد المسيح؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q5" value="إشباع الجموع"> إشباع الجموع</label>
        <label class="option-item"><input type="radio" name="q5" value="عرس قانا الجليل"> عرس قانا الجليل</label>
        <label class="option-item"><input type="radio" name="q5" value="شفاء الأعمى"> شفاء الأعمى</label>
      </div>
    </div>

    <button type="submit">إنهاء واستخراج الـ QR Code</button>
  </form>

  <!-- نتيجة الـ QR Code -->
  <div id="qr-container">
    <h3 id="finishTitle" style="color: #27ae60; margin-top:0;">تم إنهاء الامتحان بنجاح!</h3>
    <p>يرجى إظهار الشاشة للكنترول لمسح رمز الـ QR وتسجيل إجابتك:</p>
    <div id="qrcode"></div>
    <button type="button" class="reset-btn" onclick="resetForm()">بدء اختبار جديد</button>
  </div>
</div>

<script>
  const form = document.getElementById('quizForm');
  const qrContainer = document.getElementById('qr-container');
  const timerBox = document.getElementById('timerBox');
  const timerDisplay = document.getElementById('timer');
  
  let timeLeft = 120; // دقيقتين بالثواني
  let timerInterval = null;

  // تشغيل التايمر تلقائياً
  function startTimer() {
    timeLeft = 120;
    timerInterval = setInterval(() => {
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      seconds = seconds < 10 ? '0' + seconds : seconds;
      timerDisplay.textContent = `0${minutes}:${seconds}`;

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        document.getElementById('finishTitle').textContent = "انتهى الوقت المحدد!";
        document.getElementById('finishTitle').style.color = "#e74c3c";
        submitQuiz(); // تسليم تلقائي عند انتهاء الوقت
      }
      timeLeft--;
    }, 1000);
  }

  // دالة تسليم الاختبار وتوليد الـ QR
  function submitQuiz() {
    clearInterval(timerInterval);

    const name = document.getElementById('name').value || 'بدون اسم';
    const stage = document.getElementById('stage').value || 'غير محدد';

    const getAns = (q) => document.querySelector(`input[name="${q}"]:checked`)?.value || 'لم يُجب';

    const resultText = `الاسم: ${name}\nالمرحلة: ${stage}\nس1: ${getAns('q1')}\nس2: ${getAns('q2')}\nس3: ${getAns('q3')}\nس4: ${getAns('q4')}\nس5: ${getAns('q5')}`;

    form.style.display = 'none';
    timerBox.style.display = 'none';
    qrContainer.style.display = 'block';

    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(resultText)}`;
    document.getElementById('qrcode').innerHTML = `<img src="${qrUrl}" alt="QR Code" width="220" height="220">`;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitQuiz();
  });

  function resetForm() {
    form.reset();
    form.style.display = 'block';
    timerBox.style.display = 'block';
    qrContainer.style.display = 'none';
    document.getElementById('finishTitle').textContent = "تم إنهاء الامتحان بنجاح!";
    document.getElementById('finishTitle').style.color = "#27ae60";
    startTimer();
  }

  // بدء التايمر عند فتح الصفحة
  startTimer();
</script>

</body>
</html>
