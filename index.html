<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسابقة درس الكتاب</title>
  <!-- استدعاء خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- مكتبة توليد الـ QR Code برمجياً أوفلاين بدون إنترنت -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Cairo', sans-serif; 
      background: #eef2f5; 
      margin: 0;
      padding: 20px 10px; 
      direction: rtl; 
      text-align: right; 
      color: #2c3e50;
    }
    .container { 
      max-width: 600px; 
      margin: auto; 
      background: #ffffff; 
      padding: 25px 20px; 
      border-radius: 15px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
      border-top: 6px solid #3498db;
      position: relative; 
    }
    
    .header-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      margin-bottom: 20px;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 15px;
    }
    .header-logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3498db;
    }
    .header-titles { text-align: center; }
    h2 { color: #1e3a8a; font-weight: 700; font-size: 20px; margin: 0 0 4px 0; }
    h4 { color: #0284c7; font-weight: 600; font-size: 13px; margin: 0; }
    
    .timer-box { 
      position: sticky; 
      top: 10px; 
      background: #e74c3c; 
      color: white; 
      padding: 10px 15px; 
      border-radius: 10px; 
      text-align: center; 
      font-size: 18px; 
      font-weight: 700; 
      z-index: 100; 
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3); 
    }

    .form-group { 
      margin-bottom: 20px; 
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    label.question-title { 
      display: block; 
      margin-bottom: 10px; 
      font-weight: 700; 
      font-size: 15px;
      color: #1e293b;
    }
    input[type="text"] { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 15px; 
      font-family: 'Cairo', sans-serif;
      outline: none;
    }

    .options-group { display: flex; flex-direction: column; gap: 8px; }
    .option-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .option-item input[type="radio"] { width: 20px; height: 20px; accent-color: #3498db; }

    button { 
      width: 100%; 
      background: #27ae60; 
      color: white; 
      border: none; 
      padding: 14px; 
      font-size: 17px; 
      font-family: 'Cairo', sans-serif;
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 700; 
      margin-top: 15px; 
    }

    #qr-container { 
      display: none; 
      text-align: center; 
      margin-top: 20px; 
      padding: 25px 15px; 
      background: #f0fdf4; 
      border: 2px dashed #22c55e; 
      border-radius: 12px; 
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 18px auto;
    }
    #qrcode canvas, #qrcode img {
      border: 6px solid white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .reset-btn { background: #3b82f6; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <div class="timer-box" id="timerBox">الوقت المتبقي: <span id="timer">02:00</span></div>

  <div class="header-box">
    <img src="https://i.ibb.co/6R59V1q/church-logo.jpg" alt="لوجو الخدمة" class="header-logo" onerror="this.style.display='none'">
    <div class="header-titles">
      <h2>مسابقة درس الكتاب</h2>
      <h4>أسرة مارمينا والبابا كيرلس السادس لخدمة المرضى</h4>
    </div>
  </div>

  <form id="quizForm">
    <div class="form-group">
      <label class="question-title">الاسم:</label>
      <input type="text" id="name" required placeholder="أدخل الاسم الثلاثي">
    </div>

    <div class="form-group">
      <label class="question-title">اسم الأسرة / المرحلة:</label>
      <input type="text" id="stage" required placeholder="مثال: خادم / مرحلة إعدادي">
    </div>

    <div class="form-group">
      <label class="question-title">السؤال الأول: كم عدد أسفار العهد القديم؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q1" value="٣٩"> ٣٩</label>
        <label class="option-item"><input type="radio" name="q1" value="٤٦"> ٤٦</label>
        <label class="option-item"><input type="radio" name="q1" value="٣٠"> ٣٠</label>
        <label class="option-item"><input type="radio" name="q1" value="٤٠"> ٤٠</label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">السؤال الثاني: ما معنى اسم موسى؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q2" value="المنتشل من الماء"> المنتشل من الماء</label>
        <label class="option-item"><input type="radio" name="q2" value="منقذ شعب اسرائيل"> منقذ شعب اسرائيل</label>
        <label class="option-item"><input type="radio" name="q2" value="اب للأباء"> اب للأباء</label>
        <label class="option-item"><input type="radio" name="q2" value="لم يذكر"> لم يذكر</label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">السؤال الثالث: من هو كاتب سفر الخروج؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q3" value="موسى"> موسى</label>
        <label class="option-item"><input type="radio" name="q3" value="صموئيل"> صموئيل</label>
        <label class="option-item"><input type="radio" name="q3" value="داود"> داود</label>
        <label class="option-item"><input type="radio" name="q3" value="نوح"> نوح</label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">السؤال الرابع: أين استقر فلك نوح بعد أن جفت مياه الطوفان؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q4" value="جبل الزيتون"> جبل الزيتون</label>
        <label class="option-item"><input type="radio" name="q4" value="جبل سيناء"> جبل سيناء</label>
        <label class="option-item"><input type="radio" name="q4" value="جبل نيبو"> جبل نيبو</label>
        <label class="option-item"><input type="radio" name="q4" value="جبل اراراط"> جبل اراراط</label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">السؤال الخامس: ما اسم المدينة التي كان عليها ملشي صادق كاهن الله العلي؟</label>
      <div class="options-group">
        <label class="option-item"><input type="radio" name="q5" value="شكيم"> شكيم</label>
        <label class="option-item"><input type="radio" name="q5" value="حبرون"> حبرون</label>
        <label class="option-item"><input type="radio" name="q5" value="اور كلدانيين"> اور كلدانيين</label>
        <label class="option-item"><input type="radio" name="q5" value="شاليم"> شاليم</label>
      </div>
    </div>

    <button type="submit">إنهاء واستخراج الـ QR Code</button>
  </form>

  <div id="qr-container">
    <h3 id="finishTitle" style="color: #27ae60; margin-top:0;">تم إنهاء المسابقة بنجاح!</h3>
    <p>يرجى إظهار الشاشة للكنترول لمسح رمز الـ QR وتسجيل إجابتك ودرجتك:</p>
    <div id="qrcode"></div>
    <button type="button" class="reset-btn" onclick="resetForm()">بدء مسابقة جديدة</button>
  </div>
</div>

<script>
  const correctAnswers = { q1: "٤٦", q2: "المنتشل من الماء", q3: "موسى", q4: "جبل اراراط", q5: "شاليم" };
  const form = document.getElementById('quizForm');
  const qrContainer = document.getElementById('qr-container');
  const timerBox = document.getElementById('timerBox');
  const timerDisplay = document.getElementById('timer');
  let timeLeft = 120, timerInterval = null;

  function startTimer() {
    timeLeft = 120;
    timerInterval = setInterval(() => {
      let minutes = Math.floor(timeLeft / 60), seconds = timeLeft % 60;
      timerDisplay.textContent = `0${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        document.getElementById('finishTitle').textContent = "انتهى الوقت المحدد!";
        document.getElementById('finishTitle').style.color = "#e74c3c";
        submitQuiz();
      }
      timeLeft--;
    }, 1000);
  }

  function submitQuiz() {
    clearInterval(timerInterval);
    const name = document.getElementById('name').value || 'بدون اسم';
    const stage = document.getElementById('stage').value || 'غير محدد';
    let score = 0;
    const getAns = (q) => {
      const val = document.querySelector(`input[name="${q}"]:checked`)?.value || 'لم يُجب';
      if (val === correctAnswers[q]) score++;
      return val;
    };

    const resultText = `الاسم: ${name}\nالمرحلة: ${stage}\nالدرجة: ${score}/5\n----------------\nس1: ${getAns('q1')}\nس2: ${getAns('q2')}\nس3: ${getAns('q3')}\nس4: ${getAns('q4')}\nس5: ${getAns('q5')}`;

    form.style.display = 'none';
    timerBox.style.display = 'none';
    qrContainer.style.display = 'block';

    document.getElementById('qrcode').innerHTML = "";
    
    // التوليد البرمجي أوفلاين
    if (typeof QRCode !== "undefined") {
      new QRCode(document.getElementById("qrcode"), {
        text: resultText,
        width: 200,
        height: 200
      });
    } else {
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(resultText)}`;
      document.getElementById('qrcode').innerHTML = `<img src="${qrUrl}" alt="QR Code" width="200" height="200">`;
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); submitQuiz(); });

  function resetForm() {
    form.reset();
    form.style.display = 'block';
    timerBox.style.display = 'block';
    qrContainer.style.display = 'none';
    document.getElementById('finishTitle').textContent = "تم إنهاء المسابقة بنجاح!";
    document.getElementById('finishTitle').style.color = "#27ae60";
    startTimer();
  }

  startTimer();
</script>

</body>
</html>
