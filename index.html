<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مسابقة درس الكتاب</title>

  <meta name="theme-color" content="#0d6efd">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./images/church-logo.jpg">
  <link rel="apple-touch-icon" href="./images/church-logo.jpg">

  <script src="./js/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #0d6efd;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 0 0 20px 20px;
    }

    .header img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      padding: 5px;
    }

    .header h1 {
      margin: 10px 0 5px;
    }

    .header p {
      margin: 0;
    }

    .timer {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      color: #d9534f;
      margin: 20px 0;
      padding: 12px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
    }

    .info {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .question {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .question h3 {
      margin-top: 0;
      color: #0d6efd;
      font-size: 18px;
    }

    label {
      display: block;
      padding: 10px;
      margin: 7px 0;
      background: #f1f3f5;
      border-radius: 10px;
      cursor: pointer;
    }

    label:hover {
      background: #e2e6ea;
    }

    label input[type="radio"] {
      margin-left: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #198754;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #157347;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    #result {
      display: none;
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    #qrcode {
      margin-top: 20px;
      overflow: auto;
    }

    #qrcode svg {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <div class="header">
    <img src="./images/church-logo.jpg" alt="شعار الكنيسة">
    <h1>مسابقة درس الكتاب</h1>
    <p>اختبار الخدام ❤️</p>
  </div>

  <div class="container">

    <!-- العداد -->
    <div class="timer">
      ⏱️ الوقت المتبقي:
      <span id="timer">10:00</span>
    </div>

    <!-- البيانات -->
    <div class="info">

      <label for="name">الاسم</label>
      <input
        type="text"
        id="name"
        placeholder="اكتب اسمك"
      >

      <label for="service">اسم الخدمة</label>
      <input
        type="text"
        id="service"
        placeholder="اكتب اسم الخدمة"
      >

    </div>
