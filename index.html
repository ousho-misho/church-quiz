<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استبيان خدام الكنيسة</title>
  <!-- مكتبة توليد الـ QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; padding: 20px; direction: rtl; text-align: right; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
    
    .options-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
    .option-item { display: flex; align-items: center; gap: 10px; font-weight: normal; cursor: pointer; }
    .option-item input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }

    button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #219150; }

    /* منطقة الـ QR Code بعد التسليم */
    #qr-container { display: none; text-align: center; margin-top: 25px; padding: 20px; background: #eef9f1; border: 2px dashed #27ae60; border-radius: 10px; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; }
    .reset-btn { background: #3498db; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>استبيان خدام الكنيسة</h2>

  <form id="quizForm">
    <!-- البيانات الأساسية -->
    <div class="form-group">
      <label>اسم الخادم:</label>
      <input type="text" id="name" required placeholder="أدخل الاسم الثلاثي">
    </div>

    <div class="form-group">
      <label>اسم الأسرة / المرحلة:</label>
      <input type="text" id="stage" required placeholder="مثال: ابتدائي / إعدادي">
    </div>

    <!-- سؤال مقالي -->
    <div class="form-group">
      <label>سؤال 1: ما هو المفهوم الأساسي للخدمة؟</label>
      <textarea id="q1" rows="3" required placeholder="اكتب إجابتك هنا..."></textarea>
    </div>

    <!-- سؤال اختيار من متعدد 1 -->
    <div class="form-group">
      <label>سؤال 2: كم عدد أسفار العهد الجديد؟</label>
      <div class="options-group">
        <label class="option-item">
          <input type="radio" name="q2" value="27 سِفر" required> 27 سِفر
        </label>
        <label class="option-item">
          <input type="radio" name="q2" value="39 سِفر"> 39 سِفر
        </label>
        <label class="option-item">
          <input type="radio" name="q2" value="46 سِفر"> 46 سِفر
        </label>
      </div>
    </div>

    <!-- سؤال اختيار من متعدد 2 -->
    <div class="form-group">
      <label>سؤال 3: متى تُقام القداسات الإلهية؟</label>
      <div class="options-group">
        <label class="option-item">
          <input type="radio" name="q3" value="صباحاً" required> صباحاً
        </label>
        <label class="option-item">
          <input type="radio" name="q3" value="مساءً"> مساءً
        </label>
        <label class="option-item">
          <input type="radio" name="q3" value="حسب الترتيب والطقس"> حسب الترتيب والطقس
        </label>
      </div>
    </div>

    <button type="submit">إنهاء واستخراج الـ QR Code</button>
  </form>

  <!-- النتيجة بالـ QR -->
  <div id="qr-container">
    <h3 style="color: #27ae60; margin-top:0;">تم إنهاء الامتحان بنجاح!</h3>
    <p>يرجى إظهار الشاشة للكنترول لمسح رمز الـ QR وتسجيل إجابتك:</p>
    <div id="qrcode"></div>
    <button type="button" class="reset-btn" onclick="resetForm()">حل امتحان جديد</button>
  </div>
</div>

<script>
  const form = document.getElementById('quizForm');
  const qrContainer = document.getElementById('qr-container');
  let qrcodeObj = null;

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const selectedQ2 = document.querySelector('input[name="q2"]:checked')?.value || '';
    const selectedQ3 = document.querySelector('input[name="q3"]:checked')?.value || '';

    // تجميع الإجابات في نص موحد للـ QR
    const resultText = `الاسم: ${document.getElementById('name').value}\nالمرحلة: ${document.getElementById('stage').value}\nس1: ${document.getElementById('q1').value}\nس2: ${selectedQ2}\nس3: ${selectedQ3}`;

    // إخفاء الاستبيان وإظهار الـ QR
    form.style.display = 'none';
    qrContainer.style.display = 'block';

    // توليد الـ QR Code
    document.getElementById('qrcode').innerHTML = '';
    qrcodeObj = new QRCode(document.getElementById("qrcode"), {
      text: resultText,
      width: 220,
      height: 220
    });
  });

  function resetForm() {
    form.reset();
    form.style.display = 'block';
    qrContainer.style.display = 'none';
  }
</script>

</body>
</html>
