<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة مسابقة درس الكتاب</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f1eb;
      margin: 0;
      padding: 20px;
      color: #30281f;
    }
    .card {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0001;
    }
    input, button {
      padding: 12px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    input { max-width: 100%; box-sizing: border-box; }
    button {
      cursor: pointer;
      background: #654c35;
      color: white;
      border: 0;
    }
    button:disabled { opacity: .5; }
    .hidden { display: none; }
    .status { margin: 12px 0; white-space: pre-wrap; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      min-width: 600px;
    }
    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: right;
    }
    th { background: #eee7dd; }
  </style>
</head>
<body>
  <div class="card" id="loginBox">
    <h2>إدارة مسابقة درس الكتاب ❤️</h2>
    <p>سجّلي الدخول لعرض النتائج وإدارة المحاولات.</p>
    <input id="password" type="password"
      placeholder="كلمة مرور الإدارة">
    <button onclick="login()">دخول</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <div class="card hidden" id="dashboard">
    <h2>النتائج</h2>
    <button onclick="loadResults()">تحديث النتائج</button>
    <div id="status" class="status"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>المرحلة</th>
            <th>الدرجة</th>
            <th>التاريخ</th>
            <th>إعادة المحاولة</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </div>

  <script>
    let token = '';

    function showMessage(id, message) {
      document.getElementById(id).textContent = message || '';
    }

    function login() {
      const password = document.getElementById('password').value;
      showMessage('loginStatus', 'جارٍ التحقق...');

      google.script.run
        .withSuccessHandler(result => {
          token = result.token;
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          loadResults();
        })
        .withFailureHandler(error => {
          showMessage('loginStatus', error.message || 'تعذر تسجيل الدخول.');
        })
        .loginAdmin(password);
    }

    function loadResults() {
      showMessage('status', 'جارٍ تحميل النتائج...');

      google.script.run
        .withSuccessHandler(renderResults)
        .withFailureHandler(error => {
          showMessage('status', error.message || 'تعذر تحميل النتائج.');
        })
        .getResults(token);
    }

    function renderResults(rows) {
      const tbody = document.getElementById('results');
      tbody.replaceChildren();

      if (!rows.length) {
        showMessage('status', 'لا توجد نتائج مسجلة حتى الآن.');
        return;
      }

      showMessage('status', 'عدد النتائج: ' + rows.length);

      rows.forEach(item => {
        const tr = document.createElement('tr');

        [item.name, item.stage, item.score, item.date].forEach(value => {
          const td = document.createElement('td');
          td.textContent = value || '';
          tr.appendChild(td);
        });

        const retryCell = document.createElement('td');
        const retryButton = document.createElement('button');
        retryButton.textContent =
          item.retry === 'نعم' ? 'إلغاء السماح' : 'السماح بمحاولة';
        retryButton.onclick = () => changeRetry(
          item.row, item.retry !== 'نعم'
        );
        retryCell.appendChild(retryButton);
        tr.appendChild(retryCell);

        const actionCell = document.createElement('td');
        const deleteButton = document.createElement('button');
        deleteButton.textContent = 'حذف النتيجة';
        deleteButton.onclick = () => removeResult(item.row);
        actionCell.appendChild(deleteButton);
        tr.appendChild(actionCell);

        tbody.appendChild(tr);
      });
    }

    function changeRetry(row, allowed) {
      if (!confirm(allowed
        ? 'السماح بمحاولة إضافية لهذا المتسابق؟'
        : 'إلغاء السماح بالمحاولة الإضافية؟')) return;

      google.script.run
        .withSuccessHandler(loadResults)
        .withFailureHandler(error => alert(error.message))
        .setRetryPermission(token, row, allowed);
    }

    function removeResult(row) {
      if (!confirm('متأكدة من حذف النتيجة؟')) return;

      google.script.run
        .withSuccessHandler(loadResults)
        .withFailureHandler(error => alert(error.message))
        .deleteResult(token, row);
    }
  </script>
</body>
</html>
