<script>

const correctAnswers = {

  q1: "آدم",

  q2: "على بطنك تسعين وترابًا تأكلين",

  q3: "أبكار غنم",

  q4: "شيث",

  q5: "أخنوخ",

  q6: "أبناء الذين ولدوا من تزوج أبناء شيث مع بنات قايين",

  q7: "٦٠٠ سنة",

  q8: "١٥٠ يوم",

  q9: "٣٠٠ ذراع طول و٥٠ ذراع عرض و٣٠ ذراع ارتفاع",

  q10: "لامك",

  q11: "سام وحام ويافث"

};


const form =
  document.getElementById("quizForm");

const timerBox =
  document.getElementById("timerBox");

const timerDisplay =
  document.getElementById("timer");

const qrContainer =
  document.getElementById("qr-container");

const qrcodeEl =
  document.getElementById("qrcode");

const scoreText =
  document.getElementById("scoreText");

const finishTitle =
  document.getElementById("finishTitle");


let timeLeft = 90;

let timerInterval = null;

let submitted = false;


function updateTimerDisplay() {

  const minutes =
    Math.floor(Math.max(timeLeft, 0) / 60);

  const seconds =
    Math.max(timeLeft, 0) % 60;

  timerDisplay.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}


function stopTimer() {

  if (timerInterval !== null) {

    clearInterval(timerInterval);

    timerInterval = null;

  }

}


function startTimer() {

  stopTimer();

  timeLeft = 90;

  updateTimerDisplay();

  timerInterval =
    setInterval(function () {

      timeLeft--;

      updateTimerDisplay();

      if (timeLeft <= 0) {

        stopTimer();

        finishTitle.textContent =
          "انتهى الوقت المحدد!";

        finishTitle.style.color =
          "#e74c3c";

        submitQuiz();

      }

    }, 1000);

}


function getAnswer(question) {

  const selected =
    document.querySelector(
      'input[name="' +
      question +
      '"]:checked'
    );

  return selected
    ? selected.value
    : "لم يُجب";

}


function submitQuiz() {

  if (submitted) return;

  submitted = true;

  stopTimer();


  const name =
    document.getElementById("name")
      .value
      .trim() || "بدون اسم";


  const stage =
    document.getElementById("stage")
      .value
      .trim() || "غير محدد";


  let score = 0;


  const answers = {};


  for (const question in correctAnswers) {

    answers[question] =
      getAnswer(question);

    if (
      answers[question] ===
      correctAnswers[question]
    ) {

      score++;

    }

  }


  const resultText =
`الاسم: ${name}
المرحلة: ${stage}
الدرجة: ${score}/11
----------------
س1: ${answers.q1}
س2: ${answers.q2}
س3: ${answers.q3}
س4: ${answers.q4}
س5: ${answers.q5}
س6: ${answers.q6}
س7: ${answers.q7}
س8: ${answers.q8}
س9: ${answers.q9}
س10: ${answers.q10}
س11: ${answers.q11}`;


  form.style.display = "none";

  timerBox.style.display = "none";

  qrContainer.style.display = "block";


  scoreText.innerHTML =
    "<h2>درجتك: " +
    score +
    "/11</h2>";


  qrcodeEl.innerHTML = "";


  try {

    if (
      typeof qrcode === "undefined"
    ) {

      throw new Error(
        "QR library not loaded"
      );

    }


    qrcode.stringToBytes =
      qrcode.stringToBytesFuncs["UTF-8"];


    const qr =
      qrcode(0, "M");


    const scannerURL =
      "https://script.google.com/macros/s/AKfycbwfqwnUDieOCOScxoXwHZxrrALHOKxLIQvKvEx9W3poPdsxka1kVF8U3zVKXKbcIsM/exec";


    const qrData =
      scannerURL +
      "?data=" +
      encodeURIComponent(resultText);


    qr.addData(
      qrData,
      "Byte"
    );


    qr.make();


    qrcodeEl.innerHTML =
      qr.createSvgTag({

        cellSize: 5,

        margin: 4,

        scalable: true

      });


  } catch (error) {

    console.error(
      "QR Error:",
      error
    );


    qrcodeEl.innerHTML =
      `
      <div class="qr-error">
        تعذر إنشاء رمز الـQR.
        <br>
        برجاء إبلاغ المسؤول.
      </div>
      `;

  }


  window.scrollTo({

    top: document.body.scrollHeight,

    behavior: "smooth"

  });

}


form.addEventListener(
  "submit",
  function (event) {

    event.preventDefault();

    submitQuiz();

  }
);


startTimer();

</script>

}

<script>

  const correctAnswers = {
    q1: "آدم",
    q2: "على بطنك تسعين وترابًا تأكلين",
    q3: "أبكار غنم",
    q4: "شيث",
    q5: "أخنوخ",
    q6: "أبناء الذين ولدوا من تزوج أبناء شيث مع بنات قايين",
    q7: "600 سنة",
    q8: "150 يوم",
    q9: "300 ذراع طول و50 ذراع عرض و30 ذراع ارتفاع",
    q10: "لامك",
    q11: "سام وحام ويافث"
  };


  let timeLeft = 90;
  let timerInterval = null;
  let submitted = false;


  const timerDisplay = document.getElementById("timer");


  function updateTimerDisplay() {

    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    timerDisplay.textContent =
      "0" +
      minutes +
      ":" +
      (seconds < 10 ? "0" + seconds : seconds);

  }


  function startTimer() {

    updateTimerDisplay();

    timerInterval = setInterval(function () {

      timeLeft--;

      if (timeLeft <= 0) {

        timeLeft = 0;

        updateTimerDisplay();

        document.getElementById("finishTitle").textContent =
          "انتهى الوقت المحدد!";

        document.getElementById("finishTitle").style.color =
          "#e74c3c";

        submitQuiz();

        return;
      }

      updateTimerDisplay();

    }, 1000);

  }


  function stopTimer() {

    if (timerInterval) {

      clearInterval(timerInterval);

      timerInterval = null;

    }

  }


  function getAnswer(question) {

    const selected =
      document.querySelector(
        'input[name="' + question + '"]:checked'
      );

    return selected ? selected.value : "لم يتم الإجابة";

  }


  function submitQuiz() {

    if (submitted) return;

    submitted = true;

    stopTimer();


    const name =
      document.getElementById("name").value.trim() ||
      "بدون اسم";


    const stage =
      document.getElementById("stage").value.trim() ||
      "غير محدد";


    let score = 0;


    Object.keys(correctAnswers).forEach(function(question) {

      const answer = getAnswer(question);

      if (answer === correctAnswers[question]) {

        score++;

      }

    });


    let resultText =
      "الاسم: " + name + "\n" +
      "المنطقة / الخدمة / اللجنة: " + stage + "\n" +
      "الدرجة: " + score + "/11\n" +
      "----------------\n";


    for (let i = 1; i <= 11; i++) {

      resultText +=
        "س" + i + ": " +
        getAnswer("q" + i) +
        "\n";

    }


    document.getElementById("quizForm").style.display =
      "none";

    document.getElementById("timer").style.display =
      "none";

    document.getElementById("result").style.display =
      "block";

    document.getElementById("score").textContent =
      "درجتك: " + score + " / 11";


    const qrContainer =
      document.getElementById("qrcode");

    qrContainer.innerHTML = "";

    document.getElementById("qrError").textContent = "";


    try {

      if (typeof qrcode === "undefined") {

        throw new Error("QR library not loaded");

      }


      qrcode.stringToBytes =
        qrcode.stringToBytesFuncs["UTF-8"];


      const qr = qrcode(0, "M");

      qr.addData(resultText, "Byte");

      qr.make();


      const qrSvg =
        qr.createSvgTag({
          scalable: true,
          cellSize: 5,
          margin: 4
        });


      qrContainer.innerHTML = qrSvg;


      /*
        رابط استقبال البيانات
      */
      const scannerURL =
        "https://script.google.com/macros/s/AKfycbwfqwnUDieOCOScxoXWHzxrrALHOKxLIQvKvEx9W3poPdsxka1kVF8U3zVKXKbcIsM/exec";


      /*
        الرابط الموجود داخل الـ QR
      */
      const qrData =
        scannerURL +
        "?data=" +
        encodeURIComponent(resultText);


      const qr2 = qrcode(0, "M");

      qr2.addData(qrData, "Byte");

      qr2.make();


      qrContainer.innerHTML =
        qr2.createSvgTag({
          scalable: true,
          cellSize: 5,
          margin: 4
        });


    } catch (error) {

      console.error(error);

      document.getElementById("qrError").textContent =
        "تعذر إنشاء رمز الـQR. تأكدي من وجود اتصال بالإنترنت لتحميل مكتبة الـQR.";

    }

  }


  startTimer();

<script>

const correctAnswers = {

  q1: "آدم",

  q2: "على بطنك تسعين وترابًا تأكلين",

  q3: "أبكار غنم",

  q4: "شيث",

  q5: "أخنوخ",

  q6: "أبناء الذين ولدوا من تزوج أبناء شيث مع بنات قايين",

  q7: "٦٠٠ سنة",

  q8: "١٥٠ يوم",

  q9: "٣٠٠ ذراع طول و٥٠ ذراع عرض و٣٠ ذراع ارتفاع",

  q10: "لامك",

  q11: "سام وحام ويافث"

};


const form =
  document.getElementById("quizForm");

const timerBox =
  document.getElementById("timerBox");

const timerDisplay =
  document.getElementById("timer");

const qrContainer =
  document.getElementById("qr-container");

const qrcodeEl =
  document.getElementById("qrcode");

const scoreText =
  document.getElementById("scoreText");

const finishTitle =
  document.getElementById("finishTitle");


let timeLeft = 90;

let timerInterval = null;

let submitted = false;


function updateTimerDisplay() {

  const minutes =
    Math.floor(Math.max(timeLeft, 0) / 60);

  const seconds =
    Math.max(timeLeft, 0) % 60;

  timerDisplay.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}


function stopTimer() {

  if (timerInterval !== null) {

    clearInterval(timerInterval);

    timerInterval = null;

  }

}


function startTimer() {

  stopTimer();

  timeLeft = 90;

  updateTimerDisplay();

  timerInterval =
    setInterval(function () {

      timeLeft--;

      updateTimerDisplay();

      if (timeLeft <= 0) {

        stopTimer();

        finishTitle.textContent =
          "انتهى الوقت المحدد!";

        finishTitle.style.color =
          "#e74c3c";

        submitQuiz();

      }

    }, 1000);

}


function getAnswer(question) {

  const selected =
    document.querySelector(
      'input[name="' +
      question +
      '"]:checked'
    );

  return selected
    ? selected.value
    : "لم يُجب";

}


function submitQuiz() {

  if (submitted) return;

  submitted = true;

  stopTimer();


  const name =
    document.getElementById("name")
      .value
      .trim() || "بدون اسم";


  const stage =
    document.getElementById("stage")
      .value
      .trim() || "غير محدد";


  let score = 0;


  const answers = {};


  for (const question in correctAnswers) {

    answers[question] =
      getAnswer(question);

    if (
      answers[question] ===
      correctAnswers[question]
    ) {

      score++;

    }

  }


  const resultText =
`الاسم: ${name}
المرحلة: ${stage}
الدرجة: ${score}/11
----------------
س1: ${answers.q1}
س2: ${answers.q2}
س3: ${answers.q3}
س4: ${answers.q4}
س5: ${answers.q5}
س6: ${answers.q6}
س7: ${answers.q7}
س8: ${answers.q8}
س9: ${answers.q9}
س10: ${answers.q10}
س11: ${answers.q11}`;


  form.style.display = "none";

  timerBox.style.display = "none";

  qrContainer.style.display = "block";


  scoreText.innerHTML =
    "<h2>درجتك: " +
    score +
    "/11</h2>";


  qrcodeEl.innerHTML = "";


  try {

    if (
      typeof qrcode === "undefined"
    ) {

      throw new Error(
        "QR library not loaded"
      );

    }


    qrcode.stringToBytes =
      qrcode.stringToBytesFuncs["UTF-8"];


    const qr =
      qrcode(0, "M");


    const scannerURL =
      "https://script.google.com/macros/s/AKfycbwfqwnUDieOCOScxoXwHZxrrALHOKxLIQvKvEx9W3poPdsxka1kVF8U3zVKXKbcIsM/exec";


    const qrData =
      scannerURL +
      "?data=" +
      encodeURIComponent(resultText);


    qr.addData(
      qrData,
      "Byte"
    );


    qr.make();


    qrcodeEl.innerHTML =
      qr.createSvgTag({

        cellSize: 5,

        margin: 4,

        scalable: true

      });


  } catch (error) {

    console.error(
      "QR Error:",
      error
    );


    qrcodeEl.innerHTML =
      `
      <div class="qr-error">
        تعذر إنشاء رمز الـQR.
        <br>
        برجاء إبلاغ المسؤول.
      </div>
      `;

  }


  window.scrollTo({

    top: document.body.scrollHeight,

    behavior: "smooth"

  });

}


form.addEventListener(
  "submit",
  function (event) {

    event.preventDefault();

    submitQuiz();

  }
);


startTimer();

</script>

  // تسجيل الـ Service Worker لتفعيل العمل بدون إنترنت (PWA).  
  // هذا الكود منفصل تمامًا عن منطق المسابقة أعلاه ولا يؤثر عليه بأي شكل.  
  if ('serviceWorker' in navigator) {  
    window.addEventListener('load', () => {  
      // مسار نسبي (وليس "/service-worker.js") حتى يعمل بشكل صحيح  
      // سواء كان الموقع على جذر الدومين أو داخل مسار فرعي لمشروع GitHub Pages  
      // مثل: https://username.github.io/REPO/  
      navigator.serviceWorker.register('./service-worker.js')  
        .then((registration) => {  
          const showReadyMsg = () => {  
            const msg = document.getElementById('offlineReadyMsg');  
            if (!msg) return;  
            msg.style.display = 'block';  
            setTimeout(() => { msg.style.display = 'none'; }, 4000);  
          };  
  
          // لو يوجد Service Worker يعمل بالفعل ويتحكم في الصفحة، فهذا يعني أن التخزين تم مسبقًا.  
          if (navigator.serviceWorker.controller) {  
            showReadyMsg();  
          }  
  
          // في أول مرة، ننتظر انتهاء تثبيت النسخة الجديدة لإعلام المستخدم أن التخزين اكتمل.  
          if (registration.installing) {  
            registration.installing.addEventListener('statechange', function () {  
              if (this.state === 'activated') {  
                showReadyMsg();  
              }  
            });  
          }  
        })  
        .catch((err) => {  
          // فشل تسجيل الـ Service Worker لا يجب أن يوقف عمل المسابقة نفسها،  
          // فقط لن تتوفر ميزة العمل بدون إنترنت.  
          console.error('فشل تسجيل Service Worker:', err);  
        });  
    });  
  }
